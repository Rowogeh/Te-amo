<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Un mensaje de amor con contador en tiempo real">
    <title>Te amo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Quicksand:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Countdown Banner -->
    <div class="countdown-banner">
        <p class="countdown-label">Mi amor por ti comenzó hace...</p>
        <div class="countdown" id="countdown">
            <span class="time-unit"><span class="number" id="days">0</span> días</span>
            <span class="time-unit"><span class="number" id="hours">0</span> horas</span>
            <span class="time-unit"><span class="number" id="minutes">0</span> minutos</span>
            <span class="time-unit"><span class="number" id="seconds">0</span> segundos</span>
        </div>
    </div>
    <div class="container">
        <!-- Letters / Flip Card Section -->
        <div class="letters-section">
            <h2 class="love-notes-title">
                <span class="love-notes-title-icon">💌</span>
                Escritos por nosotros
            </h2>
            <div class="cards-carousel letters-carousel">
                <button class="cards-nav-btn" id="prevCard" aria-label="Carta anterior">❮</button>

                <div class="flip-card-stage letters-stage">
                    <div class="flip-card" id="flipCard">
                        <div class="flip-card-front">
                            <div class="card-front-deco">💌</div>
                            <p class="card-front-title" id="cardFrontTitle">Carta 1</p>
                            <p class="card-front-hint">Toca para leer</p>
                            <div class="card-number-badge" id="cardNumber">1</div>
                        </div>
                        <div class="flip-card-back">
                            <div class="card-scroll-inner">
                                <p class="card-message" id="cardMessage"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <button class="cards-nav-btn" id="nextCard" aria-label="Siguiente carta">❯</button>
            </div>
            <div class="card-dots" id="cardDots"></div>
        </div>

        <div class="photo-collage">
            <div class="photo-grid">
                <div class="photo-item photo-1">
                    <img src="photo1.jpeg" alt="Memory 1">
                </div>
                <div class="photo-item photo-2">
                    <img src="photo2.jpeg" alt="Memory 2">
                </div>
                <div class="photo-item photo-3">
                    <img src="photo3.jpeg" alt="Memory 3">
                </div>
                <div class="photo-item photo-4">
                    <img src="photo4.jpeg" alt="Memory 4">
                </div>
                <div class="photo-item photo-5">
                    <img src="photo5.jpeg" alt="Memory 5">
                </div>
                <div class="photo-item photo-6">
                    <img src="photo6.jpeg" alt="Memory 6">
                </div>
            </div>
        </div>

        <!-- Audio Player -->
        <audio id="backgroundMusic">
            Your browser does not support the audio element.
        </audio>

        <!-- Mini Music Player -->
        <div class="music-player" id="musicPlayer">
            <div class="music-player-info">
                <span class="music-player-icon">🎵</span>
                <span class="music-player-title" id="songTitle">Cargando...</span>
            </div>
            <div class="music-player-controls">
                <button class="player-btn" id="prevBtn" aria-label="Canción anterior">⏮</button>
                <button class="player-btn play-btn" id="playBtn" aria-label="Reproducir/Pausar">▶</button>
                <button class="player-btn" id="nextBtn" aria-label="Siguiente canción">⏭</button>
            </div>
            <div class="music-player-progress">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <div class="falling-petals" id="fallingPetals"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
